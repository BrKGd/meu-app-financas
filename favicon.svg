<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Stealth Obsidian & Graphite -->
    <linearGradient id="stealthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Emerald Power Gradient -->
    <linearGradient id="emeraldPower" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="40%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Metallic Titanium Border -->
    <linearGradient id="titaniumBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="shadowShield" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#stealthBg)"/>

  <!-- Metallic Outer Ring -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="url(#titaniumBorder)" stroke-width="3.5"/>

  <!-- Executive Shield & Wall Street Bull/Growth Emblem -->
  <g filter="url(#shadowShield)">
    
    <!-- Outer Stealth Shield Base -->
    <path d="M 256 70 L 400 120 L 400 270 C 400 375, 256 445, 256 445 C 256 445, 112 375, 112 270 L 112 120 Z" 
          fill="#0F172A" stroke="#1E293B" stroke-width="6"/>

    <!-- Inner Shield Inset -->
    <path d="M 256 94 L 376 136 L 376 260 C 376 348, 256 412, 256 412 C 256 412, 136 348, 136 260 L 136 136 Z" 
          fill="#020617" opacity="0.9"/>

    <!-- Dynamic Bold Upward Financial Arrow / Geometric Crest -->
    <!-- Bar 1 (Left low) -->
    <rect x="175" y="270" width="34" height="70" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <!-- Bar 2 (Mid) -->
    <rect x="225" y="220" width="34" height="120" rx="6" fill="#047857"/>
    <!-- Bar 3 (High Emerald) -->
    <rect x="275" y="170" width="34" height="170" rx="6" fill="url(#emeraldPower)"/>
    <!-- Bar 4 (Top Gold Peak) -->
    <rect x="325" y="140" width="34" height="200" rx="6" fill="url(#goldAccent)"/>

    <!-- Bold Sharp Upward Lightning Arrow -->
    <path d="M 160 300 L 245 210 L 290 255 L 375 140" 
          fill="none" stroke="url(#emeraldPower)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#emeraldGlow)"/>
    
    <!-- Arrowhead -->
    <path d="M 335 140 L 375 140 L 375 180" 
          fill="none" stroke="url(#emeraldPower)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Currency / Dollar Crest Badge at Center Bottom -->
    <circle cx="256" cy="360" r="32" fill="url(#goldAccent)" filter="url(#emeraldGlow)"/>
    <text x="256" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#020617" text-anchor="middle">$</text>
  </g>
</svg>
